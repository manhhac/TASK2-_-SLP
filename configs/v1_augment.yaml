version: v1_augment
description: "V1: thêm 3 kỹ thuật augment (speed/noise/reverb) + speaker cap + oversample minority."
data:
  raw_dirs: ["data/raw/vietnamese/vivos"]
  manifest_dir: "data/manifests"
  feature_dir: "data/features"
  sample_rate: 16000
  min_dur: 0.5
  max_dur: 30.0
  min_rms: 0.005
  clip_threshold: 0.99
  clip_ratio_max: 0.20
  max_chars_per_sec: 25.0
  min_chars_per_sec: 2.0
  train_ratio: 0.70
  dev_ratio: 0.15
  test_ratio: 0.15
  seed: 42
  n_mels: 80
  tokenizer_vocab: 8000
model:
  asr_model: "openai/whisper-small"
  mt_model: "Helsinki-NLP/opus-mt-vi-en"
  use_lora: false
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "v_proj"]
train:
  output_dir: "outputs/v1"
  num_epochs: 10
  batch_size: 16
  grad_accum: 2
  lr: 1.0e-4
  warmup_ratio: 0.1
  weight_decay: 0.01
  fp16: true
  eval_steps: 500
  save_steps: 500
  logging_steps: 50
  patience: 3
  seeds: [42, 123, 2024]
  use_augment: true
  use_beam_search: false
  beam_size: 5
  use_lm_fusion: false
